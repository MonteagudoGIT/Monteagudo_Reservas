<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; background: #efece6; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: .88; }
  </style>
</helmet>
<div style="width: 390px; min-height: 900px; margin: 0 auto; background: #f6f4f0; display: flex; flex-direction: column; color: #23201c; font-size: 15px; line-height: 1.5;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 8px;">
    <span style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d9d3c8; display: flex; align-items: center; justify-content: center; background: #fff;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201c" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <span style="font-weight: 600; font-size: 17px;">Crear cuenta</span>
  </div>

  <div style="flex: 1; padding: 12px 24px 24px;">
    <div style="color: #6b6459; font-size: 13px;">Cada vecino tiene su cuenta. Los datos de la vivienda los revisa el administrador.</div>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; gap: 12px;">
        <label style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 12px; font-weight: 600; color: #6b6459;">Nombre</span>
          <span style="height: 46px; border: 1px solid #d9d3c8; border-radius: 11px; background: #fff; display: flex; align-items: center; padding: 0 13px;">Joaquín</span>
        </label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 12px; font-weight: 600; color: #6b6459;">Apellidos</span>
          <span style="height: 46px; border: 1px solid #d9d3c8; border-radius: 11px; background: #fff; display: flex; align-items: center; padding: 0 13px;">Cuesta G.</span>
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: #6b6459;">Email</span>
        <span style="height: 46px; border: 1px solid #d9d3c8; border-radius: 11px; background: #fff; display: flex; align-items: center; padding: 0 13px;">joaquin@correo.es</span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: #6b6459;">Vivienda</span>
        <span style="height: 46px; border: 1px solid #d9d3c8; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; color: #23201c;">
          Portal 2 · 3.&ordm; B
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#948c7e" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: #6b6459;">Contraseña</span>
        <span style="height: 46px; border: 1px solid #d9d3c8; border-radius: 11px; background: #fff; display: flex; align-items: center; padding: 0 13px; color: #948c7e;">Mínimo 8 caracteres</span>
      </label>
    </div>

    <div style="margin-top: 16px; display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: #6b6459;">
      <span style="width: 18px; height: 18px; border-radius: 5px; border: 1px solid #c9c2b5; background: #fff; flex: none; margin-top: 1px;"></span>
      Acepto la <a style="color: #477358; font-weight: 600;">política de privacidad</a> y las condiciones de uso.
    </div>
  </div>

  <div style="position: sticky; bottom: 0; padding: 14px 24px 20px; background: #f6f4f0; border-top: 1px solid #e6e1d8;">
    <a style="display: flex; align-items: center; justify-content: center; height: 50px; background: #477358; color: #fff; border-radius: 12px; font-weight: 600;">Crear cuenta</a>
  </div>
</div>
</x-dc>
</body>
</html>
