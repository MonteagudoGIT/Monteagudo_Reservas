<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; background: #efece6; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: .88; }
  </style>
</helmet>
<div style="width: 390px; min-height: 900px; margin: 0 auto; background: #f6f4f0; display: flex; flex-direction: column; color: #23201c; font-size: 15px; line-height: 1.5;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 8px;">
    <span style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d9d3c8; display: flex; align-items: center; justify-content: center; background: #fff;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201c" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <div style="flex: 1;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #948c7e;">Reservar · Sala · Sáb 5 sep</div>
      <div style="font-weight: 600;">Paso 3 de 4 · Horas</div>
    </div>
  </div>
  <div style="display: flex; gap: 5px; padding: 0 20px 16px;">
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #477358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #477358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #477358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #e0dbd0;"></span>
  </div>

  <div style="flex: 1; padding: 6px 20px 20px;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #948c7e;">Franjas</div>
    <div style="margin-top: 10px; display: flex; gap: 8px;">
      <span style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; background: #fff; border: 1px solid #e6e1d8; font-size: 13px; font-weight: 600; color: #b8b0a1;">Mañana<br><span style="font-weight: 400; font-size: 11px;">ocupada</span></span>
      <span style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; background: #e6efe8; border: 2px solid #477358; font-size: 13px; font-weight: 600;">Tarde<br><span style="font-weight: 400; font-size: 11px;">17 – 23</span></span>
      <span style="flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; background: #fff; border: 1px solid #e6e1d8; font-size: 13px; font-weight: 600; color: #b8b0a1;">Día<br><span style="font-weight: 400; font-size: 11px;">no dispon.</span></span>
    </div>

    <div style="margin-top: 20px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #948c7e;">O elige por horas</div>
    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #f2efe8; color: #b8b0a1; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">10:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #f2efe8; color: #b8b0a1; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">11:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #f2efe8; color: #b8b0a1; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">12:00</span>
      <span style="grid-column: span 3; text-align: center; padding: 9px 0; border-radius: 10px; background: repeating-linear-gradient(135deg, #f2efe8, #f2efe8 7px, #eceae2 7px, #eceae2 14px); color: #948c7e; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
        Cerrado 15:00 – 17:00 · siesta
      </span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #477358; color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">17:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #477358; color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">18:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #477358; color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">19:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #477358; color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">20:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #fff; border: 1px solid #d9d3c8; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">21:00</span>
      <span style="text-align: center; padding: 11px 0; border-radius: 10px; background: #fff; border: 1px solid #d9d3c8; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">22:00</span>
    </div>

    <div style="margin-top: 18px; background: #fff; border: 1px solid #e6e1d8; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
      <span><span style="font-size: 12px; color: #6b6459;">Seleccionado</span><br><span style="font-weight: 600;">17:00 – 21:00 · 4 h</span></span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">15,00 €</span>
    </div>
  </div>

  <div style="position: sticky; bottom: 0; padding: 14px 20px 20px; background: #f6f4f0; border-top: 1px solid #e6e1d8;">
    <a style="display: flex; align-items: center; justify-content: center; height: 50px; background: #477358; color: #fff; border-radius: 12px; font-weight: 600;">Revisar la reserva</a>
  </div>
</div>
</x-dc>
</body>
</html>
