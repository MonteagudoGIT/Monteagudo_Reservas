<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; background: #efece6; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: .88; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; margin: 0 auto; background: #f6f4f0; display: flex; flex-direction: column; color: #23201c; font-size: 15px; line-height: 1.5;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 8px;">
    <span style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d9d3c8; display: flex; align-items: center; justify-content: center; background: #fff;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#23201c" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <div style="flex: 1;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #948c7e;">Reservar</div>
      <div style="font-weight: 600;">Paso 1 de 4 · Espacio</div>
    </div>
  </div>
  <div style="display: flex; gap: 5px; padding: 0 20px 16px;">
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #477358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #e0dbd0;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #e0dbd0;"></span>
    <span style="flex: 1; height: 4px; border-radius: 999px; background: #e0dbd0;"></span>
  </div>

  <div style="flex: 1; padding: 6px 20px 20px;">
    <div style="font-size: 18px; font-weight: 600;">¿Qué quieres reservar?</div>
    <div style="color: #6b6459; font-size: 13px; margin-top: 4px;">Es la misma sala. Elige el uso.</div>

    <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="background: #fff; border: 2px solid #477358; border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 42px; height: 42px; border-radius: 11px; background: #e6efe8; color: #477358; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600;">Sala</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500;">15,00 €</span>
          </div>
          <div style="color: #6b6459; font-size: 13px; margin-top: 2px;">Por franjas o por horas. Mínimo 1 h, hasta el día completo.</div>
        </div>
        <span style="width: 20px; height: 20px; border-radius: 50%; background: #477358; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg>
        </span>
      </div>

      <div style="background: #fff; border: 1px solid #e6e1d8; border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 42px; height: 42px; border-radius: 11px; background: #f4e8d5; color: #b07d2b; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>
        </span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600;">Ping Pong</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500;">6,00 €</span>
          </div>
          <div style="color: #6b6459; font-size: 13px; margin-top: 2px;">Máximo 2 h. Genera un aviso de revisión al terminar.</div>
        </div>
        <span style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid #c9c2b5; flex: none;"></span>
      </div>
    </div>
  </div>

  <div style="position: sticky; bottom: 0; padding: 14px 20px 20px; background: #f6f4f0; border-top: 1px solid #e6e1d8;">
    <a style="display: flex; align-items: center; justify-content: center; height: 50px; background: #477358; color: #fff; border-radius: 12px; font-weight: 600;">Continuar</a>
  </div>
</div>
</x-dc>
</body>
</html>
